[package]
name = "ironsight"
version = "0.8.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Client library for the FlightScope Mevo+ / Mevo Gen2 / Xi binary protocol"
repository = "https://github.com/divotmaker/ironsight"
readme = "README.md"
keywords = ["flightscope", "mevo", "golf", "launch-monitor"]
categories = ["network-programming", "parser-implementations"]
exclude = ["docs/"]

[features]
serde = ["dep:serde"]
gvp = ["dep:serde", "dep:serde_json"]
# The driver's settings (`ironsight::config`): serde types only, no device
# stack, for settings forms and WebAssembly UIs.
config = ["dep:flightrelay", "flightrelay/config", "dep:serde"]
# The `DeviceDriver` for FlightScope devices (`ironsight::driver`).
driver = ["config", "flightrelay/driver"]
# The `ironsight-frp` binary: the driver served over FRP.
frp = ["driver", "flightrelay/server", "flightrelay/main"]
# Test support: `ironsight::testing` (a scripted in-memory device, result
# frames recorded from an Xi, payload encoders). Off by default.
testing = []

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
flightrelay = { version = "0.6.0", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "ironsight-frp"
path = "src/bin/ironsight-frp.rs"
required-features = ["frp"]

[[example]]
name = "gvp_testing"
required-features = ["gvp"]
