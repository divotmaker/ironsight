name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# A plain vX.Y.Z tag is a release and must be on main: it publishes to
# crates.io and bumps the version on develop. A tag with a -betaN or -rcN
# suffix (v0.9.1-rc1) is a pre-release test build: it may come from develop,
# publishes the crate under that prerelease version (0.9.1-rc1, which Cargo
# only picks when asked for exactly), gets a GitHub pre-release with the
# binaries, and skips the version bump.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml version
        id: kind
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          suffix="${tag#"$base"}"
          cargo_version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$base" != "$cargo_version" ]; then
            echo "::error::Tag v${tag} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          if [ -n "$suffix" ]; then
            if ! [[ "$suffix" =~ ^-(beta|rc)\.?[0-9]+$ ]]; then
              echo "::error::Pre-release suffix must be -betaN or -rcN, got ${suffix}"
              exit 1
            fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            if ! git merge-base --is-ancestor "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" origin/main; then
              echo "::error::v${tag} is not on main; a build from develop needs a -betaN or -rcN suffix"
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # A pre-release publishes under the tag's full version (0.9.1-rc1),
      # set here for the upload only; Cargo.toml on develop keeps 0.9.1.
      - name: Set pre-release version
        if: needs.test.outputs.prerelease == 'true'
        run: sed -i "0,/^version = \".*\"/s//version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml

      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  version-bump:
    name: Version bump
    needs: [test, publish]
    if: needs.test.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Bump to next patch version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/^version = \".*\"/version = \"${NEXT_VERSION}\"/" Cargo.toml
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: prepare for next release (${NEXT_VERSION})"
          git push

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: linux
            target: x86_64-unknown-linux-gnu
            artifact: ironsight-frp
            asset_name: ironsight-frp-linux-x86_64
          - name: windows
            target: x86_64-pc-windows-gnu
            artifact: ironsight-frp.exe
            asset_name: ironsight-frp-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install mingw-w64
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

      - name: Build release binary
        run: cargo build --release --features frp --bin ironsight-frp --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Release
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp ironsight-frp-linux-x86_64/ironsight-frp dist/ironsight-frp-linux-x86_64
          cp ironsight-frp-windows-x86_64.exe/ironsight-frp.exe dist/ironsight-frp-windows-x86_64.exe
          chmod +x dist/ironsight-frp-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.test.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.test.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/ironsight-frp-windows-x86_64.exe
            dist/ironsight-frp-linux-x86_64
